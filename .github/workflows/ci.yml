# فحص آلي لكل دفعة وكل طلب دمج.
#
# ── لماذا `build:local` لا `build` ──────────────────────────────────
# `npm run build` يشغّل `prisma migrate deploy` — أي أن كل تشغيل للفحص
# كان سيلمس قاعدة الإنتاج، وهي القاعدة الوحيدة هنا. `build:local` يبني
# فقط، فيبقى الفحص بلا أثر جانبي.
#
# ── ولماذا لا اختبارات هنا بعد ──────────────────────────────────────
# لا توجد حزمة اختبارات في المستودع. إضافة خطوة `npm test` تفشل أو
# تمرّ فارغة، وكلاهما أسوأ من غيابها: الأولى تُعطّل الدمج بلا سبب،
# والثانية تعطي ثقة كاذبة. تُضاف الخطوة يوم تُضاف الاختبارات.
#
# ── أي فرع يُفحص ────────────────────────────────────────────────────
# المشغّل `branches: ["**"]` أي كل فرع، لكن GitHub يقرأ ملف سير العمل
# **من الفرع المدفوع نفسه**. فالفرع الذي لا يحمل هذا الملف لا يُفحص —
# وهذا يشمل `master` اليوم. دمج `masar-design-pass` هو ما يمنحه الفحص.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      # `npm ci` لا `npm install`: يبني من القفل حرفيًا ويفشل إن خالف
      # `package.json` — وهو ما يجعل القفل ذا قيمة أصلًا.
      - run: npm ci

      # مطلوب قبل أي فحص أنواع: عميل Prisma مولَّد لا مُودَع.
      - run: npx prisma generate

      - run: npx tsc --noEmit

      - run: npm run build:local
        env:
          # البناء يستورد وحدات تقرأ هذه المتغيّرات عند التحميل. قيم
          # وهمية تكفي: لا اتصال بقاعدة ولا بتخزين أثناء `next build`.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          AUTH_SECRET: "ci-placeholder-secret-not-used-at-runtime"
